# Deploy della sola web (API + GUI) usando l'immagine pubblicata su ghcr.io a
# ogni release (vedi .github/workflows/release-web-docker.yml), oppure
# buildata in locale (sezione "build" commentata sotto).
#
# M97/M98 — due mount, che sono due cose diverse e stanno in due posti diversi:
#
#   <la tua libreria>  →  /library   data/ (libreria.db, conf.json, jobs),
#                                    videos/, thumbnails/, avatars/.
#                                    Vive dove vuoi, con percorso ASSOLUTO, ma
#                                    su un disco LOCALE: il catalogo è SQLite.
#                                    I video possono stare su un NAS (vedi
#                                    il mount su /library/videos sotto).
#   ./config           →  /config    le impostazioni di QUESTA applicazione
#                                    (web.json: qualità, parallelismo, porta).
#
# La libreria fuori da questa cartella, e non dentro, perché sono cose di natura
# diversa: il deploy lo rifai in un minuto, la libreria contiene i tuoi video —
# e la apri anche dalla CLI, quindi non appartiene al container.
#
# Al primo avvio, se /library è vuota, la libreria viene inizializzata da sé:
# un deploy non è una sessione interattiva, `docker compose up -d` deve bastare.
# (La CLI invece si ferma e chiede `ondo init`: lì una cartella sbagliata è un
# errore di battitura, non un volume nuovo.)

services:
  web:
    image: ghcr.io/helmutsti/youtubecatalog-web:latest
    # Per buildare dai sorgenti locali invece di scaricare l'immagine pubblicata:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.web
    container_name: youtubecatalog-web
    restart: unless-stopped
    ports:
      # host:container — cambia la parte a sinistra se 3001 è già occupata.
      - "3001:3001"
    volumes:
      # LA TUA LIBRERIA, con un percorso assoluto e FUORI da questa cartella.
      # Non è pignoleria: questa cartella (compose + config) è usa-e-getta, la
      # libreria contiene tutti i tuoi video; e la stessa libreria la apri anche
      # con la CLI (`cd D:\MiaLibreria && ondo menu`), quindi non appartiene al
      # deploy. Sostituisci con il tuo percorso:
      - D:\MiaLibreria:/library
      # Le impostazioni di QUESTA applicazione (web.json, creato al primo
      # avvio): relativo, perché appartengono a questo compose.
      - ./config:/config
      # Area di lavoro dei download: volume Docker senza binding, sul disco
      # della macchina che fa girare il container. yt-dlp scarica, fonde e
      # verifica qui; nella libreria (e nei video, anche se su un NAS) arriva
      # solo il file finito, con una sola scrittura. Il contenuto è
      # usa-e-getta: si svuota a ogni avvio. Serve spazio libero per i video
      # in corso — circa 2× il video più grande per ogni download parallelo.
      - scratch:/scratch
      # Copie ridotte di copertine e foto per gli elenchi: si possono cancellare
      # in qualunque momento (`docker volume rm`), si ricreano da sole.
      - cache:/cache
      # (Facoltativo) I video su un disco separato dal resto della libreria:
      # monta la loro cartella al posto di videos/ dentro la libreria. Non c'è
      # niente da impostare: i video stanno sempre in <libreria>/videos.
      # - D:\Video:/library/videos
      #
      # (Facoltativo) Backup automatico della libreria (catalogo, copertine,
      # avatar; non i video) in una cartella, tipicamente sul NAS quando la
      # libreria sta su un disco locale. Attivalo con ONDO_BACKUP_DIR qui sotto.
      # - /mnt/nas/ondo-backup:/backups
      #
      # (Facoltativo) yt-dlp/ffmpeg/ffprobe sono GIÀ dentro l'immagine. Se vuoi
      # imporre una TUA versione senza aspettare un'immagine nuova, non serve un
      # mount in più: metti il binario in `config/tools/` (la cartella qui
      # accanto, già montata su /config) e ha la precedenza su quello
      # dell'immagine. Nomi attesi su Linux: yt-dlp_linux, ffmpeg, ffprobe —
      # NON i .exe di un'installazione Windows, che nel container non partono.
      #
      # (Facoltativo) cookie YouTube per video privati/non listati: caricali
      # dalla web app (Impostazioni), oppure metti il file in config/cookies.txt
      # qui accanto — già montata su /config, sopravvive agli aggiornamenti.
    # environment:
    #   # Backup automatico (vedi il mount /backups sopra): ogni quante ore e
    #   # quanti zip tenere. Senza ONDO_BACKUP_DIR non parte.
    #   ONDO_BACKUP_DIR: /backups
    #   ONDO_BACKUP_EVERY_HOURS: "24"
    #   ONDO_BACKUP_KEEP: "14"

volumes:
  scratch:
  cache:
