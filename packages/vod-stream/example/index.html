<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vod-stream esempio</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .player { position: relative; background: #000; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; display: block; }
    .spinner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
    .spinner.on { display: flex; }
    .spinner::after { content: ''; width: 48px; height: 48px; border-radius: 50%; border: 4px solid #fff3; border-top-color: #fff; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ul { padding: 0; list-style: none; } li { padding: 6px 0; cursor: pointer; color: #9cf; }
    #mode { color: #aaa; margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <div class="player"><video id="v" controls playsinline></video><div class="spinner" id="spin"></div></div>
  <label><input type="checkbox" id="forceHls"> forza HLS</label>
  <div id="mode"></div>
  <ul id="list"></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script type="module">
  import { attachVideo, watchBuffering } from '/client.js';
  const video = document.getElementById('v');
  const spin = document.getElementById('spin');
  const modeEl = document.getElementById('mode');
  watchBuffering(video, (b) => spin.classList.toggle('on', b));
  let player = null;
  async function open(name) {
    player?.destroy();
    const id = encodeURIComponent(name);
    player = await attachVideo(video, {
      infoUrl: `/stream/${id}/info.json`,
      directUrl: `/files/${id}`,
      preferHls: document.getElementById('forceHls').checked,
      loadHls: async () => window.Hls,
      onModeChange: (mode, url) => { modeEl.textContent = `${name}: ${mode === 'direct' ? 'file originale' : 'HLS'} — ${url}`; }
    });
    window.player = player;
    video.play().catch(() => {});
  }
  const names = await (await fetch('/videos.json')).json();
  for (const n of names) {
    const li = document.createElement('li');
    li.textContent = n;
    li.onclick = () => open(n);
    document.getElementById('list').append(li);
  }
  window.openVideo = open;
</script>
</body>
</html>
